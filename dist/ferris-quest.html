"Livello 0",topic:"COS'È UN PROGRAMMA?",subtitle:"La Ricetta e le Istruzioni Quotidiane",description:"Impara cosa significa programmare un computer usando la metafora delle istruzioni di tutti i giorni.",iconName:"Puzzle",badgeName:"Sarto degli Algoritmi",badgeIcon:"Sparkles",badgeDescription:"Hai compreso che un programma è semplicemente una sequenza di istruzioni ordinate!",steps:[{id:"L0_S1",type:"theory",title:"Cos'è un Programma e cos'è un'Istruzione?",theoryText:"Benvenuto nel mondo del coding! Un **programma computerizzato** non è altro che una lista ordinata di **istruzioni** che dicono al computer cosa fare passo dopo passo.",analogyText:"Pensa a una **ricetta di cucina**: per preparare il tè devi seguire i passi nell'ordine giusto. Se metti la bustina nell'acqua prima di scaldarla, il risultato cambia! Il computer esegue le istruzioni esattamente nell'ordine in cui le scrivi.",codeExample:`// Esempio di programma quotidiano:
1. Prendi la tazza
2. Versa l'acqua calda
3. Immergi la bustina di tè`},{id:"L0_S2",type:"example",title:"Input, Elaborazione e Output",theoryText:"Ogni programma riceve degli **Input** (dati in ingresso), li elabora tramite le istruzioni e produce un **Output** (risultato finale).",analogyText:`Nella preparazione del tè:
- INPUT: Acqua fredda + Bustina di tè + Tazza
- ISTRUZIONE: Scalda l'acqua e lascia in infusione per 3 minuti
- OUTPUT: Una deliziosa tazza di tè caldo!`,codeExample:"Input (Dati) -> Istruzioni (Elaborazione) -> Output (Risultato)"},{id:"L0_S3",type:"simple_exercise",title:"Esercizio Semplice: Riconosci la Sequenza",question:"Quale tra le seguenti è una sequenza CORRETTA di istruzioni per preparare un panino?",choices:[{id:"opt_1",label:"1. Prendi il pane -> 2. Tostalo nella griglia -> 3. Spalma la marmellata",isCorrect:!0,explanation:"Esatto! Devi prima tostare il pane prima di spalmare la marmellata."},{id:"opt_2",label:"1. Spalma la marmellata -> 2. Tostalo nella griglia -> 3. Prendi il pane",isCorrect:!1,explanation:"Sbagliato! Non puoi spalmare la marmellata prima di avere il pane o tostarlo col condimento sopra!"},{id:"opt_3",label:"1. Tostalo nella griglia -> 2. Spalma la marmellata -> 3. Metti via il pane",isCorrect:!1,explanation:"L'ordine non ha senso logico!"}],hint:"Pensa alle azioni nel mondo reale: devi avere il pane pronto prima di poterlo condire."},{id:"L0_S4",type:"autonomous_exercise",title:"Esercizio Autonomo: Riordina la Sequenza",question:"Trascina o ordina i seguenti passaggi nella sequenza corretta per inviare un messaggio con uno smartphone:",orderingItems:[{id:"item_1",text:"Accendi lo schermo dello smartphone",correctIndex:0},{id:"item_2",text:"Apri l'applicazione dei messaggi",correctIndex:1},{id:"item_3",text:"Scrivi il testo del messaggio",correctIndex:2},{id:"item_4",text:"Premi il pulsante Invia",correctIndex:3}],hint:"Immagina di avere il telefono in tasca: qual è la primissima cosa che fai?"}]},{id:1,title:"Livello 1",topic:"ISTRUZIONI E SEQUENZA",subtitle:"Guida il Bot Ferris verso la Gemma",description:"Introduciamo il concetto di comando di programmazione. Componi una sequenza di istruzioni per guidare il robot.",iconName:"Compass",badgeName:"Pilota di Sequenze",badgeIcon:"Zap",badgeDescription:"Hai dimostrato di saper comporre ed eseguire istruzioni sequenziali senza commettere errori di rotta!",steps:[{id:"L1_S1",type:"theory",title:"Istruzioni Sequenziali nel Codice",theoryText:"In programmazione, ogni riga di codice contiene una singola **istruzione**. Il computer legge ed esegue il codice dall'alto verso il basso, una riga alla volta.",analogyText:"Immagina di dare comandi vocali a un robot telecomandato: `avanza()`, `girati_a_destra()`, `raccogli()`. Il robot non inventa nulla: esegue solo ciò che hai ordinato.",codeExample:`// Programma di movimento per il Robot Ferris:
ferris.avanza();
ferris.girati_a_destra();
ferris.avanza();
ferris.raccogli_gemma();`},{id:"L1_S2",type:"simple_exercise",title:"Esercizio Semplice: Scegli la Rotta Giusta",question:"Ferris si trova a 2 passi dalla gemma ed è rivolto verso di essa. Qual è la sequenza minima per raccoglierla?",choices:[{id:"opt_1",label:"avanza(); avanza(); raccogli();",isCorrect:!0,explanation:"Perfetto! Due passi in avanti e poi il comando raccogli()."},{id:"opt_2",label:"girati(); avanza(); raccogli();",isCorrect:!1,explanation:"Girandoti cambi direzione e ti allontani dalla gemma!"},{id:"opt_3",label:"raccogli(); avanza(); avanza();",isCorrect:!1,explanation:"Non puoi raccogliere la gemma prima di esserti avvicinato!"}],hint:"Conta quante caselle separano Ferris dalla gemma."},{id:"L1_S3",type:"autonomous_exercise",title:"Esercizio Autonomo: Evita l'Ostacolo",question:"C'è un muro d'energia sulla strada diretta. Qual è la sequenza di comandi per aggirare l'ostacolo?",orderingItems:[{id:"cmd_1",text:"girati_a_sinistra();",correctIndex:0},{id:"cmd_2",text:"avanza();",correctIndex:1},{id:"cmd_3",text:"girati_a_destra();",correctIndex:2},{id:"cmd_4",text:"avanza();",correctIndex:3}],hint:"Prima svolta a sinistra per uscire dalla corsia bloccata, poi avanza e riallineati."}]},{id:2,title:"Livello 2",topic:"VALORI E VARIABILI",subtitle:"Le Scatole con Etichetta in Rust",description:"Impara a memorizzare i dati con le variabili. Scopri la differenza tra variabili immutabili e mutabili.",iconName:"Box",badgeName:"Mago delle Scatole",badgeIcon:"PackageCheck",badgeDescription:"Ora sai creare variabili, assegnare valori e modificarli con la sintassi let e let mut in Rust!",steps:[{id:"L2_S1",type:"theory",title:"Cos'è una Variabile?",theoryText:"In programmazione, una **variabile** è una **scatola con un'etichetta (nome)** utilizzata per memorizzare un dato nella memoria del computer.",analogyText:"Immagina di avere una scatola di cartone su cui scrivi a pennarello l'etichetta `punti`. Dentro la scatola metti un foglio col numero `100`. Ogni volta che il programma legge la scatola `punti`, scopre che contiene `100`!",codeExample:`// In Rust si dichiara una variabile con la parola chiave 'let':
